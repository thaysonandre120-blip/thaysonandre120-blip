<svg xmlns="http://www.w3.org/2000/svg" width="600" height="8" viewBox="0 0 600 8">
  <defs>
    <filter id="glow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="10" y="2" width="580" height="4" rx="2" fill="#00f0ff" filter="url(#glow)">
    <animate attributeName="fill"
             values="#00f0ff;#ff00ff;#39ff14;#00f0ff"
             dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity"
             values="1;0.55;1"
             dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
